name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System packages (OCR)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy vitality_bss
      - name: Tests
        run: pytest -q --cov=vitality_bss --cov-report=term --cov-fail-under=95

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vbss
          POSTGRES_PASSWORD: vbss
          POSTGRES_DB: vbss
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vbss" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev,postgres]"
      - name: Migrations + API tests against PostgreSQL
        env:
          VBSS_TEST_DATABASE_URL: postgresql+psycopg2://vbss:vbss@localhost:5432/vbss
        run: pytest -q tests/test_postgres.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t vitality-bss:ci .
      - name: Smoke test container
        run: |
          docker run -d --name vbss -p 8001:8001 \
            -e SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" \
            -e ADMIN_EMAIL=admin@example.com -e ADMIN_PASSWORD='Ci-Admin-Passw0rd!' \
            vitality-bss:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8001/readyz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8001/readyz | grep '"status":"ok"'
          docker exec vbss tesseract --version
          docker logs vbss
