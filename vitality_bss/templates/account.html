{% extends "base.html" %}
{% block title %}Account - {{ app_name }}{% endblock %}
{% block content %}
<h1>Account</h1>
<p class="sub">{{ user.email }} &middot; {{ user.role }}</p>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<div class="card narrow">
  <h2>Change password</h2>
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="current_password">Current password</label><input id="current_password" type="password" name="current_password" required autocomplete="current-password">
    <label for="new_password">New password</label><input id="new_password" type="password" name="new_password" required autocomplete="new-password">
    <p><button class="btn" type="submit">Change password</button></p>
  </form>
  <p class="muted">Changing your password signs you out everywhere.</p>
</div>
{% endblock %}
