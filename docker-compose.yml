# Production-style stack: app + PostgreSQL. Secrets come from .env (see .env.example).
#   cp .env.example .env   # then set SECRET_KEY, ADMIN_*, ENCRYPTION_KEYS, POSTGRES_PASSWORD
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vbss
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vbss
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbss"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://vbss:${POSTGRES_PASSWORD}@db:5432/vbss
      DATA_DIR: /data
      PORT: ${PORT:-8001}
    ports:
      - "127.0.0.1:${PORT:-8001}:${PORT:-8001}"   # put a TLS reverse proxy in front
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
